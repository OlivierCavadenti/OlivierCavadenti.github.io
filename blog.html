<ul class="posts posts--page">
  {%- for post in site.posts -%}
  <li>
    <a href="{{ post.url | relative_url }}">
      <span class="posts__title">{{ post.title | escape }}</span>
      <time class="label" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y' }}</time>
    </a>
  </li>
  {%- endfor -%}
</ul>

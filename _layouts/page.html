---
layout: default
body_class: page page--plain
---
<article class="prose-wrap">
  <header class="prose-head">
    {% if page.kicker %}<p class="label">{{ page.kicker }}</p>{% endif %}
    <h1 class="prose-title">{{ page.title | escape }}</h1>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>

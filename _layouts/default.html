<!DOCTYPE html>
<html lang="{{ page.lang | default: layout.lang | default: 'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#efeae0">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%233f7fc4' stroke='%231f2b2e' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff' stroke='%231f2b2e' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23c8472f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Patrick+Hand+SC&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body class="{{ page.body_class | default: layout.body_class | default: 'page' }}">
  <a class="skip" href="#main">Aller au contenu</a>

  <header class="nav" id="top">
    <a class="nav__brand" href="{{ '/' | relative_url }}">Olivier Cavadenti</a>
    <nav class="nav__links" aria-label="Navigation principale">
      <a href="{{ '/#planches' | relative_url }}">Planches</a>
      <a href="{{ '/#journal' | relative_url }}">Journal</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/#contact' | relative_url }}">Contact</a>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="footer">
    <canvas class="ink ink--strip" data-scene="walkers" aria-hidden="true"></canvas>
    <div class="footer__inner">
      <p class="footer__links">
        <a href="{{ site.author.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
        <a href="{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>
        <a href="{{ site.author.malt }}" target="_blank" rel="noopener">Malt</a>
        <a href="{{ site.author.calendly }}" target="_blank" rel="noopener">Rendez-vous</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </p>
      <p class="footer__small">© {{ site.time | date: '%Y' }} Olivier Cavadenti · Morlaix, Bretagne</p>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>

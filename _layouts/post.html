---
layout: default
body_class: page page--post
lang: en
---
<article class="prose-wrap">
  <header class="prose-head">
    <p class="label"><a href="{{ '/blog/' | relative_url }}">← Transmissions</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%d.%m.%Y' }}</time></p>
    <h1 class="prose-title">{{ page.title | escape }}</h1>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
